<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-lg" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="costGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="20%" style="stop-color:#1565c0"/>
      <stop offset="40%" style="stop-color:#6a1b9a"/>
      <stop offset="60%" style="stop-color:#e65100"/>
      <stop offset="80%" style="stop-color:#c62828"/>
      <stop offset="100%" style="stop-color:#880e4f"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="900" rx="16" fill="#f5f7fa"/>

  <!-- Title -->
  <rect width="1100" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect y="30" width="1100" height="30" fill="url(#headerGrad)"/>
  <text x="550" y="40" text-anchor="middle" fill="white" font-size="22" font-weight="700">修复规划 — 从受限动作空间选择最低代价动作</text>

  <!-- ========== SECTION 1: 五类失效模式 ========== -->
  <text x="60" y="95" font-size="16" font-weight="700" fill="#0d47a1">Step 1：失效模式识别（五类）</text>

  <!-- Section 1 background -->
  <rect x="40" y="105" width="1020" height="195" rx="12" fill="white" stroke="#e0e4e8" filter="url(#shadow)"/>

  <!-- Error type 1: evidence_fabrication -->
  <rect x="60" y="120" width="180" height="165" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="120" width="180" height="36" rx="10" fill="#c62828"/>
  <rect x="60" y="142" width="180" height="14" fill="#c62828"/>
  <text x="150" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="white">evidence_fabrication</text>
  <text x="150" y="178" text-anchor="middle" font-size="22">🔴</text>
  <text x="150" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">伪造证据</text>
  <text x="150" y="222" text-anchor="middle" font-size="10" fill="#5f6368">事实获取失败</text>
  <text x="150" y="238" text-anchor="middle" font-size="10" fill="#5f6368">幻觉输出</text>
  <rect x="75" y="248" width="150" height="18" rx="5" fill="#ffcdd2"/>
  <text x="150" y="261" text-anchor="middle" font-size="10" font-weight="700" fill="#c62828">严重 · 高优先级</text>

  <!-- Error type 2: tool_call_error -->
  <rect x="260" y="120" width="180" height="165" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <rect x="260" y="120" width="180" height="36" rx="10" fill="#e65100"/>
  <rect x="260" y="142" width="180" height="14" fill="#e65100"/>
  <text x="350" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="white">tool_call_error</text>
  <text x="350" y="178" text-anchor="middle" font-size="22">🔧</text>
  <text x="350" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">工具调用失败</text>
  <text x="350" y="222" text-anchor="middle" font-size="10" fill="#5f6368">参数错误</text>
  <text x="350" y="238" text-anchor="middle" font-size="10" fill="#5f6368">调用超时/拒绝</text>
  <rect x="275" y="248" width="150" height="18" rx="5" fill="#ffe0b2"/>
  <text x="350" y="261" text-anchor="middle" font-size="10" font-weight="700" fill="#e65100">中等 · 可重放</text>

  <!-- Error type 3: context_drop -->
  <rect x="460" y="120" width="180" height="165" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="120" width="180" height="36" rx="10" fill="#6a1b9a"/>
  <rect x="460" y="142" width="180" height="14" fill="#6a1b9a"/>
  <text x="550" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="white">context_drop</text>
  <text x="550" y="178" text-anchor="middle" font-size="22">📭</text>
  <text x="550" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#6a1b9a">上下文丢失</text>
  <text x="550" y="222" text-anchor="middle" font-size="10" fill="#5f6368">信息传递断裂</text>
  <text x="550" y="238" text-anchor="middle" font-size="10" fill="#5f6368">跨节点遗忘</text>
  <rect x="475" y="248" width="150" height="18" rx="5" fill="#e1bee7"/>
  <text x="550" y="261" text-anchor="middle" font-size="10" font-weight="700" fill="#6a1b9a">中等 · 需补注入</text>

  <!-- Error type 4: reasoning_bug -->
  <rect x="660" y="120" width="180" height="165" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="120" width="180" height="36" rx="10" fill="#1565c0"/>
  <rect x="660" y="142" width="180" height="14" fill="#1565c0"/>
  <text x="750" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="white">reasoning_bug</text>
  <text x="750" y="178" text-anchor="middle" font-size="22">🧠</text>
  <text x="750" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">推理逻辑错误</text>
  <text x="750" y="222" text-anchor="middle" font-size="10" fill="#5f6368">局部逻辑偏差</text>
  <text x="750" y="238" text-anchor="middle" font-size="10" fill="#5f6368">推断链断裂</text>
  <rect x="675" y="248" width="150" height="18" rx="5" fill="#bbdefb"/>
  <text x="750" y="261" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">中等 · 节点重跑</text>

  <!-- Error type 5: plan_bug -->
  <rect x="860" y="120" width="180" height="165" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="120" width="180" height="36" rx="10" fill="#2e7d32"/>
  <rect x="860" y="142" width="180" height="14" fill="#2e7d32"/>
  <text x="950" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="white">plan_bug</text>
  <text x="950" y="178" text-anchor="middle" font-size="22">🗺️</text>
  <text x="950" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">高层规划错误</text>
  <text x="950" y="222" text-anchor="middle" font-size="10" fill="#5f6368">目标分解偏差</text>
  <text x="950" y="238" text-anchor="middle" font-size="10" fill="#5f6368">策略选择失误</text>
  <rect x="875" y="248" width="150" height="18" rx="5" fill="#c8e6c9"/>
  <text x="950" y="261" text-anchor="middle" font-size="10" font-weight="700" fill="#2e7d32">高代价 · 分支重跑</text>

  <!-- ========== SECTION 2: 六种修复动作 ========== -->
  <text x="60" y="330" font-size="16" font-weight="700" fill="#0d47a1">Step 2：修复动作空间（六种）与代价梯度</text>

  <!-- Cost gradient bar background -->
  <rect x="40" y="342" width="1020" height="100" rx="12" fill="white" stroke="#e0e4e8" filter="url(#shadow)"/>
  <rect x="60" y="358" width="980" height="36" rx="8" fill="url(#costGrad)" opacity="0.15"/>

  <!-- Action blocks on gradient -->
  <rect x="60" y="355" width="148" height="42" rx="8" fill="#2e7d32"/>
  <text x="134" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="white">PRESERVE</text>
  <text x="134" y="388" text-anchor="middle" font-size="10" fill="#c8e6c9">完全保留</text>

  <rect x="218" y="355" width="148" height="42" rx="8" fill="#1565c0"/>
  <text x="292" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="white">PATCH</text>
  <text x="292" y="388" text-anchor="middle" font-size="10" fill="#bbdefb">原位局部修补</text>

  <rect x="376" y="355" width="148" height="42" rx="8" fill="#6a1b9a"/>
  <text x="450" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="white">REPLAY_TOOL</text>
  <text x="450" y="388" text-anchor="middle" font-size="10" fill="#e1bee7">重放工具调用</text>

  <rect x="534" y="355" width="148" height="42" rx="8" fill="#e65100"/>
  <text x="608" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="white">RERUN_NODE</text>
  <text x="608" y="388" text-anchor="middle" font-size="10" fill="#ffe0b2">重跑单节点</text>

  <rect x="692" y="355" width="148" height="42" rx="8" fill="#c62828"/>
  <text x="766" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="white">RERUN_BRANCH</text>
  <text x="766" y="388" text-anchor="middle" font-size="10" fill="#ffcdd2">重跑整个分支</text>

  <rect x="850" y="355" width="170" height="42" rx="8" fill="#880e4f"/>
  <text x="935" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="white">REWRITE_BRANCH</text>
  <text x="935" y="388" text-anchor="middle" font-size="10" fill="#fce4ec">重写整个分支</text>

  <!-- Cost labels -->
  <text x="60" y="420" font-size="11" fill="#2e7d32" font-weight="600">← 代价最低（零开销）</text>
  <text x="1040" y="420" text-anchor="end" font-size="11" fill="#880e4f" font-weight="600">代价最高（完全重写）→</text>

  <!-- ========== SECTION 3: 决策映射 ========== -->
  <text x="60" y="455" font-size="16" font-weight="700" fill="#0d47a1">Step 3：失效模式 → 修复动作 决策映射</text>

  <!-- Mapping table background -->
  <rect x="40" y="465" width="1020" height="260" rx="12" fill="white" stroke="#e0e4e8" filter="url(#shadow)"/>

  <!-- Table header -->
  <rect x="40" y="465" width="1020" height="36" rx="12" fill="#1565c0"/>
  <rect x="40" y="485" width="1020" height="16" fill="#1565c0"/>
  <text x="200" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="white">节点状态</text>
  <text x="480" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="white">默认修复动作</text>
  <text x="760" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="white">决策依据</text>
  <text x="990" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="white">代价</text>

  <!-- Row 1: Clean -->
  <rect x="40" y="501" width="1020" height="38" fill="#f1f8e9"/>
  <rect x="55" y="508" width="280" height="24" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="195" y="525" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">Clean 节点</text>
  <rect x="365" y="508" width="230" height="24" rx="6" fill="#2e7d32"/>
  <text x="480" y="525" text-anchor="middle" font-size="12" font-weight="700" fill="white">PRESERVE</text>
  <text x="760" y="525" text-anchor="middle" font-size="11" fill="#5f6368">复用评分 ≥ 80，无需干预</text>
  <rect x="940" y="510" width="100" height="18" rx="5" fill="#c8e6c9"/>
  <text x="990" y="523" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">★☆☆☆☆</text>

  <!-- Row 2: Partial -->
  <rect x="40" y="539" width="1020" height="38" fill="#ffffff"/>
  <rect x="55" y="546" width="280" height="24" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="195" y="563" text-anchor="middle" font-size="12" font-weight="600" fill="#1565c0">Partial 节点</text>
  <rect x="365" y="546" width="230" height="24" rx="6" fill="#1565c0"/>
  <text x="480" y="563" text-anchor="middle" font-size="12" font-weight="700" fill="white">PATCH</text>
  <text x="760" y="563" text-anchor="middle" font-size="11" fill="#5f6368">局部修补即可恢复，复用评分 50–80</text>
  <rect x="940" y="548" width="100" height="18" rx="5" fill="#bbdefb"/>
  <text x="990" y="561" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">★★☆☆☆</text>

  <!-- Row 3: Invalid 工具节点 -->
  <rect x="40" y="577" width="1020" height="38" fill="#f3e5f5" opacity="0.4"/>
  <rect x="55" y="584" width="280" height="24" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="195" y="601" text-anchor="middle" font-size="12" font-weight="600" fill="#6a1b9a">Invalid 工具节点</text>
  <rect x="365" y="584" width="230" height="24" rx="6" fill="#6a1b9a"/>
  <text x="480" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="white">REPLAY_TOOL</text>
  <text x="760" y="601" text-anchor="middle" font-size="11" fill="#5f6368">仅工具调用出错，重放即可</text>
  <rect x="940" y="586" width="100" height="18" rx="5" fill="#e1bee7"/>
  <text x="990" y="599" text-anchor="middle" font-size="11" font-weight="700" fill="#6a1b9a">★★★☆☆</text>

  <!-- Row 4: Invalid 普通节点 -->
  <rect x="40" y="615" width="1020" height="38" fill="#ffffff"/>
  <rect x="55" y="622" width="280" height="24" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="195" y="639" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">Invalid 普通节点</text>
  <rect x="365" y="622" width="230" height="24" rx="6" fill="#e65100"/>
  <text x="480" y="639" text-anchor="middle" font-size="12" font-weight="700" fill="white">RERUN_NODE</text>
  <text x="760" y="639" text-anchor="middle" font-size="11" fill="#5f6368">节点逻辑错误，需重新执行</text>
  <rect x="940" y="624" width="100" height="18" rx="5" fill="#ffe0b2"/>
  <text x="990" y="637" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">★★★★☆</text>

  <!-- Row 5: 规划错误 -->
  <rect x="40" y="653" width="1020" height="38" fill="#fce4ec" opacity="0.4"/>
  <rect x="55" y="660" width="280" height="24" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="195" y="677" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">规划错误（plan_bug）</text>
  <rect x="365" y="660" width="230" height="24" rx="6" fill="#c62828"/>
  <text x="480" y="677" text-anchor="middle" font-size="12" font-weight="700" fill="white">RERUN_BRANCH</text>
  <text x="760" y="677" text-anchor="middle" font-size="11" fill="#5f6368">高层规划偏差，影响整个分支</text>
  <rect x="940" y="662" width="100" height="18" rx="5" fill="#ffcdd2"/>
  <text x="990" y="675" text-anchor="middle" font-size="11" font-weight="700" fill="#c62828">★★★★★</text>

  <!-- Row 6: 分支级污染 -->
  <rect x="40" y="691" width="1020" height="34" fill="#ffffff"/>
  <rect x="55" y="696" width="280" height="24" rx="6" fill="#fce4ec" stroke="#880e4f" stroke-width="2"/>
  <text x="195" y="713" text-anchor="middle" font-size="12" font-weight="600" fill="#880e4f">分支级严重污染</text>
  <rect x="365" y="696" width="230" height="24" rx="6" fill="#880e4f"/>
  <text x="480" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="white">REWRITE_BRANCH</text>
  <text x="760" y="713" text-anchor="middle" font-size="11" fill="#5f6368">Invalid &gt; 40%，局部修补不经济</text>
  <rect x="940" y="698" width="100" height="18" rx="5" fill="#fce4ec"/>
  <text x="990" y="711" text-anchor="middle" font-size="11" font-weight="700" fill="#880e4f">★★★★★+</text>

  <!-- ========== SECTION 4: 升级机制 ========== -->
  <text x="60" y="760" font-size="16" font-weight="700" fill="#0d47a1">Step 4：局部失败自动升级机制（最多两轮）</text>

  <rect x="40" y="772" width="1020" height="110" rx="12" fill="white" stroke="#e0e4e8" filter="url(#shadow)"/>

  <!-- Upgrade flow -->
  <rect x="70" y="800" width="130" height="48" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="135" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">PATCH</text>
  <text x="135" y="838" text-anchor="middle" font-size="10" fill="#5f6368">局部修补</text>

  <line x1="200" y1="824" x2="258" y2="824" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  <text x="229" y="816" text-anchor="middle" font-size="10" font-weight="600" fill="#c62828">失败↑</text>

  <rect x="258" y="800" width="150" height="48" rx="10" fill="#e8eaf6" stroke="#283593" stroke-width="2"/>
  <text x="333" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#283593">REPLAY_TOOL</text>
  <text x="333" y="838" text-anchor="middle" font-size="10" fill="#5f6368">重放工具</text>

  <line x1="408" y1="824" x2="466" y2="824" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  <text x="437" y="816" text-anchor="middle" font-size="10" font-weight="600" fill="#c62828">失败↑</text>

  <rect x="466" y="800" width="150" height="48" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="541" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">RERUN_NODE</text>
  <text x="541" y="838" text-anchor="middle" font-size="10" fill="#5f6368">重跑节点</text>

  <line x1="616" y1="824" x2="674" y2="824" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  <text x="645" y="816" text-anchor="middle" font-size="10" font-weight="600" fill="#c62828">失败↑</text>

  <rect x="674" y="800" width="160" height="48" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="754" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">RERUN_BRANCH</text>
  <text x="754" y="838" text-anchor="middle" font-size="10" fill="#5f6368">重跑分支</text>

  <!-- Note box -->
  <rect x="860" y="795" width="185" height="58" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="952" y="815" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">最多允许两轮升级</text>
  <text x="952" y="832" text-anchor="middle" font-size="10" fill="#5f6368">避免无限重试循环</text>
  <text x="952" y="847" text-anchor="middle" font-size="10" fill="#5f6368">每轮扩大修复范围</text>

  <!-- Bottom note -->
  <text x="550" y="895" text-anchor="middle" font-size="12" fill="#78909c">核心原则：不自由生成修复方案，在固定动作空间中做成本感知选择，优先最低代价动作</text>
</svg>

